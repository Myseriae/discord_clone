worker_processes auto;

events {
    worker_connections 1024;
}

http {
    # Allow WebSocket/SignalR upgrades through the proxy.
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    upstream discordclone_api {
        server api:8080;
    }

    server {
        listen 80;
        server_name _;

        location / {
            proxy_pass         http://discordclone_api;
            proxy_http_version 1.1;

            # WebSocket support (SignalR real-time + WebRTC signaling later).
            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection $connection_upgrade;

            # Preserve client info so the API's ForwardedHeaders middleware sees the real request.
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_cache_bypass $http_upgrade;
        }
    }
}
